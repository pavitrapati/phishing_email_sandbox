name: phishing-sandbox

networks:
  sbx_control:
    name: sbx_control
    driver: bridge
  sbx_detonation:
    name: sbx_detonation
    driver: bridge
    internal: true          # no route to the real internet, ever
    ipam:
      config:
        - subnet: 172.31.240.0/24

services:
  api:
    build:
      context: ./services/api
    image: sbx-api:latest
    container_name: sbx-api
    restart: unless-stopped
    ports:
      - "${SANDBOX_BIND:-127.0.0.1}:${SANDBOX_PORT:-8090}:8090"
    networks:
      - sbx_control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      # Absolute HOST path of ./data — the daemon resolves worker bind mounts on the host,
      # not inside this container, so it must be told the real path.
      SANDBOX_HOST_DATA: "${SANDBOX_HOST_DATA:?set SANDBOX_HOST_DATA to the absolute host path of ./data}"
      SANDBOX_DATA: "/data"
      WORKER_IMAGE: "sbx-worker:latest"
      WORKER_IMAGE_WINE: "sbx-worker-wine:latest"
      DETONATION_NETWORK: "sbx_detonation"
      FAKENET_HOST: "fakenet"
      ENABLE_WINE: "${ENABLE_WINE:-0}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-180}"
      DETONATION_SECONDS: "${DETONATION_SECONDS:-45}"
      WORKER_MEMORY: "${WORKER_MEMORY:-768m}"
      WORKER_CPUS: "${WORKER_CPUS:-1.0}"
      WORKER_PIDS_LIMIT: "${WORKER_PIDS_LIMIT:-256}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-52428800}"
      API_KEY: "${API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      fakenet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fakenet:
    build:
      context: ./services/fakenet
    image: sbx-fakenet:latest
    container_name: sbx-fakenet
    hostname: fakenet
    restart: unless-stopped
    networks:
      sbx_detonation:
        ipv4_address: 172.31.240.53
      sbx_control: {}
    volumes:
      - ./data/net:/net
    environment:
      SINK_IP: "172.31.240.53"
      NET_LOG: "/net/events.jsonl"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',80),3);s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
